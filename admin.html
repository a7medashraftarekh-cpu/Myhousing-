<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة | سكني</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <header class="header">
    <div class="header-container">
      <a href="index.html" class="logo"><i class="fas fa-home"></i><span>سكني</span></a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">الرئيسية</a></li>
          <li><a href="dashboard.html">لوحة التحكم</a></li>
          <li><a href="admin.html" class="active">الإدارة</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button class="icon-btn theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
        <div class="user-menu" id="userMenu">
          <img src="" alt="User" class="user-avatar" id="userAvatar">
          <div class="dropdown" id="userDropdown">
            <a href="dashboard.html" class="dropdown-item"><i class="fas fa-user"></i> حسابي</a>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="dashboard">
    <aside class="dashboard-sidebar">
      <div class="dashboard-user">
        <img src="" alt="User" id="sidebarAvatar">
        <h3 id="sidebarName">--</h3>
        <p id="sidebarRole">مدير</p>
      </div>
      <ul class="dashboard-nav">
        <li><a href="#" class="active" onclick="showTab('users', this)"><i class="fas fa-users"></i> المستخدمين</a></li>
        <li><a href="#" onclick="showTab('properties', this)"><i class="fas fa-home"></i> العقارات</a></li>
        <li><a href="#" onclick="showTab('bookings', this)"><i class="fas fa-calendar-check"></i> الحجوزات</a></li>
        <li><a href="#" onclick="showTab('reviews', this)"><i class="fas fa-star"></i> التقييمات</a></li>
        <li><a href="#" onclick="showTab('settings', this)"><i class="fas fa-cog"></i> الإعدادات</a></li>
      </ul>
    </aside>

    <div class="dashboard-content">
      <div class="dashboard-header">
        <h1 id="adminTitle">إدارة المستخدمين</h1>
      </div>
      <div id="adminContent"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-container">
      <div class="footer-section"><h3>عن سكني</h3><p>منصة سكني هي أكبر منصة للبحث عن السكن الطلابي في مصر.</p></div>
    </div>
    <div class="footer-bottom"><p>© 2026 سكني. جميع الحقوق محفوظة.</p></div>
  </footer>

  <script src="db.js"></script>
  <script>
    let currentUser = null;
    let currentTab = 'users';

    document.addEventListener('DOMContentLoaded', async () => {
      await initDB();
      await generateDemoData();
      currentUser = getCurrentUser();
      if (!currentUser || currentUser.role !== 'admin') {
        window.location.href = currentUser ? 'index.html' : 'auth.html';
        return;
      }
      updateHeader();
      await loadAdminContent();
      setupTheme();
    });

    function updateHeader() {
      document.getElementById('userAvatar').src = currentUser.avatar;
      document.getElementById('sidebarAvatar').src = currentUser.avatar;
      document.getElementById('sidebarName').textContent = currentUser.name;
    }

    document.getElementById('userAvatar')?.addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('userDropdown').classList.toggle('show');
    });
    document.addEventListener('click', () => document.getElementById('userDropdown')?.classList.remove('show'));

    async function loadAdminContent() {
      const content = document.getElementById('adminContent');

      if (currentTab === 'users') {
        document.getElementById('adminTitle').textContent = 'إدارة المستخدمين';
        const users = await getAll('users');
        content.innerHTML = `
          <div class="table-container">
            <div class="table-header"><h3>جميع المستخدمين (${users.length})</h3></div>
            <table class="data-table">
              <thead><tr><th>المستخدم</th><th>البريد</th><th>الهاتف</th><th>الدور</th><th>تاريخ التسجيل</th></tr></thead>
              <tbody>${users.map(u => `
                <tr>
                  <td><div class="table-property"><img src="${u.avatar}" style="border-radius: 50%;"><div><h4>${u.name}</h4></div></div></td>
                  <td>${u.email}</td>
                  <td>${u.phone}</td>
                  <td><span class="status-badge status-${u.role === 'admin' ? 'confirmed' : u.role === 'owner' ? 'pending' : 'active'}">${u.role === 'admin' ? 'مدير' : u.role === 'owner' ? 'مالك' : 'طالب'}</span></td>
                  <td>${new Date(u.createdAt).toLocaleDateString('ar-EG')}</td>
                </tr>
              `).join('')}</tbody>
            </table>
          </div>
        `;
      } else if (currentTab === 'properties') {
        document.getElementById('adminTitle').textContent = 'إدارة العقارات';
        const properties = await getAll('properties');
        content.innerHTML = `
          <div class="table-container">
            <div class="table-header"><h3>جميع العقارات (${properties.length})</h3></div>
            <table class="data-table">
              <thead><tr><th>العقار</th><th>المالك</th><th>السعر</th><th>الحالة</th><th>المشاهدات</th><th>إجراءات</th></tr></thead>
              <tbody>${properties.map(p => `
                <tr>
                  <td><div class="table-property"><img src="${p.images[0]}"><div><h4>${p.title}</h4><p>${p.location}</p></div></div></td>
                  <td>${p.ownerName}</td>
                  <td>${p.price.toLocaleString()} ج.م</td>
                  <td><span class="status-badge status-${p.status}">${p.status === 'active' ? 'نشط' : 'معلق'}</span></td>
                  <td>${p.views || 0}</td>
                  <td><button class="btn btn-sm btn-danger" onclick="deleteProperty('${p.id}')">حذف</button></td>
                </tr>
              `).join('')}</tbody>
            </table>
          </div>
        `;
      } else if (currentTab === 'bookings') {
        document.getElementById('adminTitle').textContent = 'إدارة الحجوزات';
        const bookings = await getAll('bookings');
        content.innerHTML = `
          <div class="table-container">
            <div class="table-header"><h3>جميع الحجوزات (${bookings.length})</h3></div>
            <table class="data-table">
              <thead><tr><th>العقار</th><th>الطالب</th><th>المالك</th><th>السعر</th><th>الحالة</th><th>التاريخ</th></tr></thead>
              <tbody>${bookings.map(b => `
                <tr>
                  <td><div class="table-property"><img src="${b.propertyImage}"><div><h4>${b.propertyTitle}</h4></div></div></td>
                  <td>${b.userName}</td>
                  <td>${b.ownerName}</td>
                  <td>${b.totalPrice.toLocaleString()} ج.م</td>
                  <td><span class="status-badge status-${b.status}">${getStatusName(b.status)}</span></td>
                  <td>${new Date(b.createdAt).toLocaleDateString('ar-EG')}</td>
                </tr>
              `).join('')}</tbody>
            </table>
          </div>
        `;
      } else if (currentTab === 'reviews') {
        document.getElementById('adminTitle').textContent = 'إدارة التقييمات';
        const reviews = await getAll('reviews');
        content.innerHTML = `
          <div class="table-container">
            <div class="table-header"><h3>جميع التقييمات (${reviews.length})</h3></div>
            <table class="data-table">
              <thead><tr><th>المستخدم</th><th>التقييم</th><th>التعليق</th><th>التاريخ</th><th>إجراءات</th></tr></thead>
              <tbody>${reviews.map(r => `
                <tr>
                  <td><div class="table-property"><img src="${r.userAvatar}" style="border-radius: 50%;"><div><h4>${r.userName}</h4></div></div></td>
                  <td>${r.rating} <i class="fas fa-star" style="color: var(--secondary);"></i></td>
                  <td>${r.comment}</td>
                  <td>${new Date(r.createdAt).toLocaleDateString('ar-EG')}</td>
                  <td><button class="btn btn-sm btn-danger" onclick="deleteReview('${r.id}')">حذف</button></td>
                </tr>
              `).join('')}</tbody>
            </table>
          </div>
        `;
      } else if (currentTab === 'settings') {
        document.getElementById('adminTitle').textContent = 'إعدادات الموقع';
        content.innerHTML = `
          <div class="detail-section">
            <h2><i class="fas fa-cog"></i> الإعدادات العامة</h2>
            <div class="form-group"><label>اسم الموقع</label><input type="text" class="form-input" value="سكني"></div>
            <div class="form-group"><label>البريد الإلكتروني للدعم</label><input type="email" class="form-input" value="support@myhousing.com"></div>
            <div class="form-group"><label>رقم الهاتف</label><input type="tel" class="form-input" value="0123 456 7890"></div>
            <button class="btn btn-primary" onclick="showToast('تم حفظ الإعدادات', 'success')">حفظ التغييرات</button>
          </div>
          <div class="detail-section">
            <h2><i class="fas fa-database"></i> إدارة البيانات</h2>
            <p style="margin-bottom: 1rem; color: var(--gray-600);">يمكنك إعادة تعيين قاعدة البيانات وإعادة إنشاء البيانات التجريبية.</p>
            <button class="btn btn-danger" onclick="resetDatabase()">إعادة تعيين البيانات</button>
          </div>
        `;
      }
    }

    async function deleteProperty(id) {
      if (!confirm('هل أنت متأكد من حذف هذا العقار؟')) return;
      await remove('properties', id);
      showToast('تم حذف العقار', 'success');
      await loadAdminContent();
    }

    async function deleteReview(id) {
      if (!confirm('هل أنت متأكد من حذف هذا التقييم؟')) return;
      await remove('reviews', id);
      showToast('تم حذف التقييم', 'success');
      await loadAdminContent();
    }

    async function resetDatabase() {
      if (!confirm('هل أنت متأكد؟ سيتم حذف جميع البيانات!')) return;
      const req = indexedDB.deleteDatabase('MyHousingDB');
      req.onsuccess = () => {
        showToast('تم إعادة تعيين البيانات', 'success');
        setTimeout(() => location.reload(), 1500);
      };
    }

    function showTab(tab, element) {
      document.querySelectorAll('.dashboard-nav a').forEach(a => a.classList.remove('active'));
      element.classList.add('active');
      currentTab = tab;
      loadAdminContent();
    }

    function getStatusName(status) {
      const names = { pending: 'معلق', confirmed: 'مؤكد', cancelled: 'ملغي', completed: 'مكتمل' };
      return names[status] || status;
    }

    function setupTheme() {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.getElementById('themeToggle').innerHTML = '<i class="fas fa-sun"></i>';
      }
      document.getElementById('themeToggle').addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (isDark) {
          document.documentElement.removeAttribute('data-theme');
          localStorage.setItem('theme', 'light');
          document.getElementById('themeToggle').innerHTML = '<i class="fas fa-moon"></i>';
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          localStorage.setItem('theme', 'dark');
          document.getElementById('themeToggle').innerHTML = '<i class="fas fa-sun"></i>';
        }
      });
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icons = { success: 'fa-check-circle', error: 'fa-times-circle', warning: 'fa-exclamation-circle' };
      toast.innerHTML = `<i class="fas ${icons[type]}"></i><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(-20px)'; setTimeout(() => toast.remove(), 300); }, 3000);
    }
  </script>
</body>
</html>
