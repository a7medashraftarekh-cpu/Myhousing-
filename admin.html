<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com 'unsafe-inline'; style-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; img-src * data:; connect-src https://*.firebaseio.com https://*.googleapis.com;">
  <title>لوحة الإدارة | سكني</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .navbar { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.06); padding: 12px 0; position: sticky; top: 0; z-index: 50; }
    .nav-container { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .logo { font-size: 22px; font-weight: 700; color: #0d6efd; text-decoration: none; }
    .nav-links { display: flex; gap: 24px; align-items: center; }
    .nav-links a { color: #333; text-decoration: none; font-size: 15px; font-weight: 500; }
    .nav-links a:hover, .nav-links a.active { color: #0d6efd; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .admin-header { padding: 40px 0 20px; }
    .admin-header h1 { font-size: 28px; margin-bottom: 8px; }
    .admin-header p { color: #666; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); text-align: center; }
    .stat-card h3 { font-size: 32px; color: #0d6efd; margin-bottom: 8px; }
    .stat-card p { color: #666; font-size: 14px; }
    .admin-table { width: 100%; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .admin-table th, .admin-table td { padding: 14px 16px; text-align: right; border-bottom: 1px solid #eee; }
    .admin-table th { background: #f8f9fa; font-weight: 600; font-size: 14px; }
    .admin-table tr:hover { background: #f8f9fa; }
    .btn-sm { padding: 6px 14px; font-size: 13px; border-radius: 6px; border: none; cursor: pointer; font-weight: 500; }
    .btn-approve { background: #198754; color: #fff; }
    .btn-reject { background: #dc3545; color: #fff; }
    .section-title { font-size: 20px; margin-bottom: 16px; margin-top: 32px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo"><i class="fas fa-home"></i> سكني</a>
      <div class="nav-links">
        <a href="index.html">الرئيسية</a>
        <a href="dashboard.html">لوحة التحكم</a>
        <a href="admin.html" class="active">لوحة الإدارة</a>
        <a href="#" onclick="logoutUser(); return false;">تسجيل الخروج</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="admin-header">
      <h1>لوحة الإدارة</h1>
      <p>إدارة المنصة والمستخدمين</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><h3 id="statUsers">0</h3><p>مستخدم</p></div>
      <div class="stat-card"><h3 id="statProps">0</h3><p>عقار</p></div>
      <div class="stat-card"><h3 id="statBookings">0</h3><p>حجز</p></div>
      <div class="stat-card"><h3 id="statPending">0</h3><p>بانتظار الموافقة</p></div>
    </div>

    <h2 class="section-title">العقارات المعلقة</h2>
    <div style="overflow-x:auto;">
      <table class="admin-table">
        <thead>
          <tr><th>العنوان</th><th>المالك</th><th>السعر</th><th>المنطقة</th><th>الإجراءات</th></tr>
        </thead>
        <tbody id="pendingTable"></tbody>
      </table>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="utils.js"></script>
  <script src="auth.js"></script>
  <script src="db.js"></script>
  <script>
    auth.onAuthStateChanged(async function(user) {
      if (!user) {
        window.location.href = 'auth.html?redirect=' + encodeURIComponent(window.location.pathname);
        return;
      }
      var snap = await db.ref('users/' + user.uid + '/role').get();
      if (snap.val() !== 'admin') {
        window.location.href = 'index.html';
        return;
      }
      loadStats();
      loadPending();
    });

    async function loadStats() {
      var users = await getAll('users');
      var props = await getAll('properties');
      var bookings = await getAll('bookings');
      document.getElementById('statUsers').textContent = users.length;
      document.getElementById('statProps').textContent = props.length;
      document.getElementById('statBookings').textContent = bookings.length;
      document.getElementById('statPending').textContent = props.filter(function(p) { return p.status === 'pending'; }).length;
    }

    async function loadPending() {
      var props = await getAll('properties');
      var pending = props.filter(function(p) { return p.status === 'pending'; });
      var tbody = document.getElementById('pendingTable');
      if (pending.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#666; padding:40px;">مفيش عقارات معلقة</td></tr>';
        return;
      }
      tbody.innerHTML = pending.map(function(p) {
        return '<tr>' +
          '<td>' + escapeHtml(p.title) + '</td>' +
          '<td>' + escapeHtml(p.ownerName) + '</td>' +
          '<td>' + p.price + ' ج.م</td>' +
          '<td>' + escapeHtml(p.area) + '</td>' +
          '<td>' +
            '<button class="btn-sm btn-approve" onclick="updateStatus('' + p.id + '', 'active')">موافقة</button> ' +
            '<button class="btn-sm btn-reject" onclick="updateStatus('' + p.id + '', 'rejected')">رفض</button>' +
          '</td>' +
        '</tr>';
      }).join('');
    }

    async function updateStatus(pid, status) {
      try {
        var p = await getById('properties', pid);
        if (p) {
          p.status = status;
          await put('properties', p);
          showToast(status === 'active' ? 'تمت الموافقة على العقار' : 'تم رفض العقار', 'success');
          loadStats();
          loadPending();
        }
      } catch (e) {
        showToast('فشل التحديث: ' + e.message, 'error');
      }
    }
  </script>
</body>
</html>
