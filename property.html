<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com 'unsafe-inline'; style-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; img-src * data:; connect-src https://*.firebaseio.com https://*.googleapis.com;">
  <title>تفاصيل العقار | سكني</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .navbar { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.06); padding: 12px 0; position: sticky; top: 0; z-index: 50; }
    .nav-container { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .logo { font-size: 22px; font-weight: 700; color: #0d6efd; text-decoration: none; }
    .nav-links { display: flex; gap: 24px; align-items: center; }
    .nav-links a { color: #333; text-decoration: none; font-size: 15px; font-weight: 500; }
    .nav-links a:hover, .nav-links a.active { color: #0d6efd; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .property-gallery { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; border-radius: 16px; overflow: hidden; margin: 24px 0; }
    .property-gallery img { width: 100%; height: 100%; object-fit: cover; min-height: 200px; }
    .property-gallery .main-img { grid-row: span 2; }
    @media (max-width: 768px) { .property-gallery { grid-template-columns: 1fr; } .property-gallery .main-img { grid-row: span 1; } }
    .property-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .property-price { font-size: 28px; font-weight: 700; color: #0d6efd; }
    .property-meta { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; color: #666; }
    .property-meta span { display: flex; align-items: center; gap: 6px; }
    .amenities-list { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
    .amenity-tag { background: #f8f9fa; padding: 8px 16px; border-radius: 20px; font-size: 14px; display: flex; align-items: center; gap: 6px; }
    .owner-card { display: flex; align-items: center; gap: 16px; padding: 20px; background: #f8f9fa; border-radius: 12px; margin-top: 24px; }
    .owner-card img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }
    .review-card { padding: 16px; border-bottom: 1px solid #eee; }
    .review-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .review-header img { width: 40px; height: 40px; border-radius: 50%; }
    .stars { color: #ffc107; }
    .btn-contact { background: #198754; color: #fff; padding: 12px 24px; border-radius: 10px; border: none; font-size: 16px; cursor: pointer; font-weight: 600; }
    .btn-fav { background: #fff; border: 1.5px solid #dc3545; color: #dc3545; padding: 12px 24px; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: 600; }
    .btn-fav.active { background: #dc3545; color: #fff; }
    .section-title { font-size: 20px; margin: 32px 0 16px; }
    .action-btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
    .review-form { background: #f8f9fa; padding: 20px; border-radius: 12px; margin-top: 24px; }
    .review-form select, .review-form textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; margin-top: 8px; font-family: inherit; }
    .review-form button { margin-top: 12px; }
    .error-msg { color: #dc3545; font-size: 13px; margin-top: 6px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo"><i class="fas fa-home"></i> سكني</a>
      <div class="nav-links">
        <a href="index.html">الرئيسية</a>
        <a href="dashboard.html">لوحة التحكم</a>
        <a href="favorites.html">المفضلة</a>
        <a href="auth.html" id="authLink">تسجيل الدخول</a>
      </div>
    </div>
  </nav>

  <div class="container" style="padding-bottom: 60px;">
    <div id="propertyContent">
      <div class="property-gallery" id="gallery"></div>

      <div class="property-header">
        <div>
          <h1 id="propTitle">--</h1>
          <p style="color:#666;" id="propLocation"><i class="fas fa-map-marker-alt"></i> --</p>
        </div>
        <div class="property-price" id="propPrice">--</div>
      </div>

      <div class="property-meta" id="propMeta"></div>

      <h3 class="section-title">وصف العقار</h3>
      <p style="line-height:1.8; color:#444;" id="propDesc">--</p>

      <h3 class="section-title">الخدمات والمرافق</h3>
      <div class="amenities-list" id="propAmenities"></div>

      <div class="owner-card" id="ownerCard">
        <img id="ownerAvatar" src="" alt="">
        <div>
          <h4 id="ownerName">--</h4>
          <p style="color:#666; font-size:14px;" id="ownerPhone">--</p>
        </div>
      </div>

      <div class="action-btns">
        <button class="btn-contact" id="contactBtn" onclick="contactOwner()"><i class="fas fa-comment"></i> تواصل مع المالك</button>
        <button class="btn-fav" id="favBtn" onclick="toggleFav()"><i class="fas fa-heart"></i> <span id="favText">أضف للمفضلة</span></button>
      </div>

      <h3 class="section-title">التقييمات والمراجعات (<span id="reviewsCount">0</span>)</h3>
      <div id="reviewsList"></div>

      <div id="addReviewSection" style="display:none;">
        <div class="review-form">
          <h4>أضف تقييمك</h4>
          <div style="margin:12px 0;">
            <label>التقييم (1-5)</label>
            <select id="reviewRating">
              <option value="5">5 نجوم ⭐⭐⭐⭐⭐</option>
              <option value="4">4 نجوم ⭐⭐⭐⭐</option>
              <option value="3">3 نجوم ⭐⭐⭐</option>
              <option value="2">2 نجوم ⭐⭐</option>
              <option value="1">1 نجمة ⭐</option>
            </select>
          </div>
          <div style="margin:12px 0;">
            <label>تعليقك</label>
            <textarea id="reviewComment" rows="3" placeholder="اكتب رأيك في العقار..."></textarea>
          </div>
          <button class="btn-contact" onclick="submitReview()">إرسال التقييم</button>
          <div class="error-msg" id="reviewError"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="utils.js"></script>
  <script src="auth.js"></script>
  <script src="db.js"></script>
  <script>
    var currentProperty = null;
    var currentUser = null;
    var propId = new URLSearchParams(window.location.search).get('id');

    auth.onAuthStateChanged(async function(user) {
      currentUser = user;
      if (user) {
        document.getElementById('authLink').textContent = 'تسجيل الخروج';
        document.getElementById('authLink').onclick = function() { logoutUser(); return false; };
        document.getElementById('addReviewSection').style.display = 'block';
        var fav = await isFavorite(user.uid, propId);
        updateFavBtn(fav);
      } else {
        document.getElementById('authLink').textContent = 'تسجيل الدخول';
        document.getElementById('authLink').href = 'auth.html?redirect=' + encodeURIComponent(window.location.href);
      }
      loadProperty();
    });

    async function loadProperty() {
      if (!propId) {
        document.getElementById('propertyContent').innerHTML = '<p style="text-align:center; color:#666; padding:60px;">مفيش عقار محدد</p>';
        return;
      }

      currentProperty = await getById('properties', propId);
      if (!currentProperty) {
        document.getElementById('propertyContent').innerHTML = '<p style="text-align:center; color:#666; padding:60px;">العقار مش موجود</p>';
        return;
      }

      await incrementPropertyViews(propId);

      // Gallery
      var gallery = document.getElementById('gallery');
      if (currentProperty.images && currentProperty.images.length > 0) {
        gallery.innerHTML = currentProperty.images.map(function(img, i) {
          return '<img src="' + escapeHtml(img) + '" class="' + (i===0 ? 'main-img' : '') + '" alt="صورة العقار" onerror="this.src='https://via.placeholder.com/800x600?text=No+Image'">';
        }).join('');
      }

      // Info
      document.getElementById('propTitle').textContent = currentProperty.title || 'عقار';
      document.getElementById('propLocation').innerHTML = '<i class="fas fa-map-marker-alt"></i> ' + escapeHtml(currentProperty.location || '');
      document.getElementById('propPrice').textContent = (currentProperty.price || 0) + ' ج.م/شهر';
      document.getElementById('propDesc').textContent = currentProperty.description || '';

      // Meta
      document.getElementById('propMeta').innerHTML =
        '<span><i class="fas fa-bed"></i> ' + (currentProperty.rooms || 1) + ' غرف</span>' +
        '<span><i class="fas fa-users"></i> ' + (currentProperty.studentsPerRoom || 1) + ' طالب/غرفة</span>' +
        '<span><i class="fas fa-star"></i> ' + (currentProperty.rating || 0) + ' (' + (currentProperty.reviewsCount || 0) + ' تقييم)</span>' +
        '<span><i class="fas fa-eye"></i> ' + ((currentProperty.views || 0) + 1) + ' مشاهدة</span>' +
        '<span><i class="fas fa-calendar"></i> متاح من ' + (currentProperty.availableFrom || '--') + '</span>';

      // Amenities
      var amenities = document.getElementById('propAmenities');
      if (currentProperty.amenities && currentProperty.amenities.length > 0) {
        amenities.innerHTML = currentProperty.amenities.map(function(a) {
          return '<span class="amenity-tag"><i class="fas ' + escapeHtml(a.icon) + '"></i> ' + escapeHtml(a.name) + '</span>';
        }).join('');
      }

      // Owner
      document.getElementById('ownerName').textContent = escapeHtml(currentProperty.ownerName || 'مالك');
      document.getElementById('ownerPhone').textContent = currentProperty.ownerPhone || '';
      document.getElementById('ownerAvatar').src = currentProperty.ownerAvatar || 'https://ui-avatars.com/api/?name=Owner&background=random';

      loadReviews();
    }

    async function loadReviews() {
      var reviews = await getPropertyReviews(propId);
      document.getElementById('reviewsCount').textContent = reviews.length;
      var list = document.getElementById('reviewsList');
      if (reviews.length === 0) {
        list.innerHTML = '<p style="color:#666;">مفيش تقييمات لسه. كن أول من يقيم!</p>';
        return;
      }
      list.innerHTML = reviews.map(function(r) {
        return '<div class="review-card">' +
          '<div class="review-header">' +
            '<img src="' + escapeHtml(r.userAvatar || '') + '" alt="" onerror="this.src='https://ui-avatars.com/api/?name=User&background=random'">' +
            '<div>' +
              '<div style="font-weight:600;">' + escapeHtml(r.userName || 'مستخدم') + '</div>' +
              '<div class="stars">' + '⭐'.repeat(r.rating || 0) + '</div>' +
            '</div>' +
            '<span style="margin-right:auto; color:#999; font-size:12px;">' + new Date(r.createdAt).toLocaleDateString('ar-EG') + '</span>' +
          '</div>' +
          '<p style="color:#444; margin-top:8px;">' + escapeHtml(r.comment || '') + '</p>' +
        '</div>';
      }).join('');
    }

    async function toggleFav() {
      if (!currentUser) {
        window.location.href = 'auth.html?redirect=' + encodeURIComponent(window.location.href);
        return;
      }
      var isFav = await toggleFavorite(currentUser.uid, propId);
      updateFavBtn(isFav);
      showToast(isFav ? 'تمت الإضافة للمفضلة' : 'تمت الإزالة من المفضلة', 'success');
    }

    function updateFavBtn(isFav) {
      var btn = document.getElementById('favBtn');
      var text = document.getElementById('favText');
      if (isFav) {
        btn.classList.add('active');
        text.textContent = 'في المفضلة';
      } else {
        btn.classList.remove('active');
        text.textContent = 'أضف للمفضلة';
      }
    }

    function contactOwner() {
      if (!currentUser) {
        window.location.href = 'auth.html?redirect=' + encodeURIComponent(window.location.href);
        return;
      }
      window.location.href = 'chat.html?owner=' + currentProperty.ownerId + '&property=' + propId;
    }

    async function submitReview() {
      var rating = parseInt(document.getElementById('reviewRating').value);
      var comment = document.getElementById('reviewComment').value.trim();
      var errorEl = document.getElementById('reviewError');
      errorEl.textContent = '';

      if (!comment) {
        errorEl.textContent = 'اكتب تعليقك الأول';
        return;
      }

      try {
        var userSnap = await db.ref('users/' + currentUser.uid).get();
        var userData = userSnap.val() || {};

        await add('reviews', {
          id: 'rev_' + Date.now(),
          propertyId: propId,
          userId: currentUser.uid,
          userName: userData.name || 'مستخدم',
          userAvatar: userData.avatar || '',
          rating: rating,
          comment: comment,
          createdAt: new Date().toISOString()
        });

        // Update property rating
        var allReviews = await getPropertyReviews(propId);
        var avg = allReviews.reduce(function(s, r) { return s + (r.rating || 0); }, 0) / allReviews.length;
        currentProperty.rating = parseFloat(avg.toFixed(1));
        currentProperty.reviewsCount = allReviews.length;
        await put('properties', currentProperty);

        document.getElementById('reviewComment').value = '';
        loadReviews();
        loadProperty();
        showToast('تم إرسال التقييم بنجاح!', 'success');
      } catch (e) {
        errorEl.textContent = 'فشل إرسال التقييم: ' + e.message;
      }
    }
  </script>
</body>
</html>
