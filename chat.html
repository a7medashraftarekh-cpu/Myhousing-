<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com 'unsafe-inline'; style-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; img-src * data:; connect-src https://*.firebaseio.com https://*.googleapis.com;">
  <title>الرسائل | سكني</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .navbar { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.06); padding: 12px 0; position: sticky; top: 0; z-index: 50; }
    .nav-container { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .logo { font-size: 22px; font-weight: 700; color: #0d6efd; text-decoration: none; }
    .nav-links { display: flex; gap: 24px; align-items: center; }
    .nav-links a { color: #333; text-decoration: none; font-size: 15px; font-weight: 500; }
    .nav-links a:hover, .nav-links a.active { color: #0d6efd; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .chat-container { display: grid; grid-template-columns: 300px 1fr; gap: 20px; height: calc(100vh - 80px); margin-top: 20px; }
    @media (max-width: 768px) { .chat-container { grid-template-columns: 1fr; } }
    .chat-sidebar { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .chat-header { padding: 16px 20px; border-bottom: 1px solid #eee; font-weight: 600; }
    .chat-list { overflow-y: auto; max-height: calc(100% - 60px); }
    .chat-item { display: flex; align-items: center; gap: 12px; padding: 14px 20px; cursor: pointer; transition: 0.2s; border-bottom: 1px solid #f5f5f5; }
    .chat-item:hover, .chat-item.active { background: #f8f9fa; }
    .chat-item img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
    .chat-item.unread { border-right: 3px solid #0d6efd; }
    .chat-main { background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); display: flex; flex-direction: column; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 70%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; }
    .message.sent { align-self: flex-end; background: #0d6efd; color: #fff; border-bottom-left-radius: 4px; }
    .message.received { align-self: flex-start; background: #f1f3f5; color: #333; border-bottom-right-radius: 4px; }
    .message-time { font-size: 11px; opacity: 0.7; margin-top: 4px; }
    .chat-input { padding: 16px 20px; border-top: 1px solid #eee; display: flex; gap: 12px; }
    .chat-input input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 24px; font-size: 15px; }
    .chat-input button { width: 44px; height: 44px; border-radius: 50%; background: #0d6efd; color: #fff; border: none; cursor: pointer; }
    .empty-chat { display: flex; align-items: center; justify-content: center; height: 100%; color: #999; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo"><i class="fas fa-home"></i> سكني</a>
      <div class="nav-links">
        <a href="index.html">الرئيسية</a>
        <a href="dashboard.html">لوحة التحكم</a>
        <a href="chat.html" class="active">الرسائل</a>
        <a href="#" onclick="logoutUser(); return false;">تسجيل الخروج</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="chat-container">
      <div class="chat-sidebar">
        <div class="chat-header">المحادثات</div>
        <div class="chat-list" id="chatList"></div>
      </div>
      <div class="chat-main">
        <div class="chat-header" id="chatHeader" style="display:none;">
          <div style="display:flex; align-items:center; gap:12px;">
            <img id="chatAvatar" src="" style="width:40px; height:40px; border-radius:50%;">
            <span id="chatName" style="font-weight:600;"></span>
          </div>
        </div>
        <div class="chat-messages" id="chatMessages">
          <div class="empty-chat">اختر محادثة عشان تبدأ</div>
        </div>
        <div class="chat-input" id="chatInput" style="display:none;">
          <input type="text" id="messageInput" placeholder="اكتب رسالتك..." onkeypress="if(event.key==='Enter')sendMessage()">
          <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="utils.js"></script>
  <script src="auth.js"></script>
  <script src="db.js"></script>
  <script>
    var currentUser = null;
    var currentChatId = null;
    var currentReceiverId = null;
    var currentReceiverName = '';
    var currentReceiverAvatar = '';

    auth.onAuthStateChanged(async function(user) {
      if (!user) {
        window.location.href = 'auth.html?redirect=' + encodeURIComponent(window.location.pathname);
        return;
      }
      currentUser = user;
      loadChats();
      var params = new URLSearchParams(window.location.search);
      var ownerId = params.get('owner');
      if (ownerId) {
        var chatId = [currentUser.uid, ownerId].sort().join('_');
        openChat(chatId, ownerId);
      }
    });

    async function loadChats() {
      var chats = await getUserChats(currentUser.uid);
      var list = document.getElementById('chatList');
      if (chats.length === 0) {
        list.innerHTML = '<div style="padding:20px; text-align:center; color:#666;">مفيش رسائل لسه</div>';
        return;
      }
      list.innerHTML = chats.map(function(c) {
        var otherId = c.lastMessage.senderId === currentUser.uid ? c.lastMessage.receiverId : c.lastMessage.senderId;
        var otherName = c.lastMessage.senderId === currentUser.uid ? c.lastMessage.receiverId : c.lastMessage.senderName;
        var otherAvatar = c.lastMessage.senderId === currentUser.uid ? '' : c.lastMessage.senderAvatar;
        return '<div class="chat-item ' + (c.unread > 0 ? 'unread ' : '') + (currentChatId === c.chatId ? 'active' : '') + '" onclick="openChat('' + c.chatId + '', '' + otherId + '')">' +
          '<img src="' + escapeHtml(otherAvatar || 'https://ui-avatars.com/api/?name=User&background=random') + '" onerror="this.src='https://ui-avatars.com/api/?name=User&background=random'">' +
          '<div style="flex:1; min-width:0;">' +
            '<div style="font-weight:600; font-size:14px; margin-bottom:2px;">' + escapeHtml(otherName || 'مستخدم') + '</div>' +
            '<div style="font-size:13px; color:#666; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + escapeHtml(c.lastMessage.content) + '</div>' +
          '</div>' +
          (c.unread > 0 ? '<span style="background:#0d6efd; color:#fff; font-size:11px; padding:2px 8px; border-radius:10px;">' + c.unread + '</span>' : '') +
        '</div>';
      }).join('');
    }

    async function openChat(chatId, otherId) {
      currentChatId = chatId;
      currentReceiverId = otherId;
      var otherSnap = await db.ref('users/' + otherId).get();
      var otherData = otherSnap.val() || {};
      currentReceiverName = otherData.name || 'مستخدم';
      currentReceiverAvatar = otherData.avatar || 'https://ui-avatars.com/api/?name=User&background=random';

      document.getElementById('chatHeader').style.display = 'block';
      document.getElementById('chatInput').style.display = 'flex';
      document.getElementById('chatName').textContent = escapeHtml(currentReceiverName);
      document.getElementById('chatAvatar').src = currentReceiverAvatar;

      loadMessages(chatId);

      var messages = await getAll('messages');
      for (var i = 0; i < messages.length; i++) {
        var m = messages[i];
        if (m.chatId === chatId && m.receiverId === currentUser.uid && !m.read) {
          await db.ref('messages/' + m.id + '/read').set(true);
        }
      }
      loadChats();
    }

    async function loadMessages(chatId) {
      var messages = await getChatMessages(chatId);
      var container = document.getElementById('chatMessages');
      if (messages.length === 0) {
        container.innerHTML = '<div class="empty-chat">ابدأ المحادثة الآن</div>';
        return;
      }
      container.innerHTML = messages.map(function(m) {
        return '<div class="message ' + (m.senderId === currentUser.uid ? 'sent' : 'received') + '">' +
          '<div>' + escapeHtml(m.content) + '</div>' +
          '<div class="message-time">' + new Date(m.createdAt).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}) + '</div>' +
        '</div>';
      }).join('');
      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
      var input = document.getElementById('messageInput');
      var content = input.value.trim();
      if (!content || !currentChatId || !currentReceiverId) return;

      var userSnap = await db.ref('users/' + currentUser.uid).get();
      var userData = userSnap.val() || {};

      await add('messages', {
        id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
        chatId: currentChatId,
        senderId: currentUser.uid,
        senderName: userData.name || 'مستخدم',
        senderAvatar: userData.avatar || '',
        receiverId: currentReceiverId,
        content: content,
        createdAt: new Date().toISOString(),
        read: false
      });

      input.value = '';
      loadMessages(currentChatId);
      loadChats();
    }
  </script>
</body>
</html>
