<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com 'unsafe-inline'; style-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; img-src * data:; connect-src https://*.firebaseio.com https://*.googleapis.com;">
  <title>لوحة التحكم | سكني</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .navbar { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.06); padding: 12px 0; position: sticky; top: 0; z-index: 50; }
    .nav-container { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .logo { font-size: 22px; font-weight: 700; color: #0d6efd; text-decoration: none; }
    .nav-links { display: flex; gap: 24px; align-items: center; }
    .nav-links a { color: #333; text-decoration: none; font-size: 15px; font-weight: 500; }
    .nav-links a:hover, .nav-links a.active { color: #0d6efd; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .dashboard-header { padding: 40px 0 20px; }
    .dashboard-header h1 { font-size: 28px; margin-bottom: 8px; }
    .dashboard-header p { color: #666; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-bottom: 32px; }
    .stat-card { background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); text-align: center; }
    .stat-card h3 { font-size: 32px; color: #0d6efd; margin-bottom: 8px; }
    .stat-card p { color: #666; font-size: 14px; }
    .section-title { font-size: 20px; margin-bottom: 16px; margin-top: 32px; }
    .property-list-card { background: #fff; border-radius: 12px; padding: 16px 20px; margin-bottom: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.04); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .property-list-card h4 { margin-bottom: 4px; }
    .property-list-card p { color: #666; font-size: 14px; }
    .badge-status { padding: 4px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .status-active { background: #d4edda; color: #155724; }
    .status-pending { background: #fff3cd; color: #856404; }
    .btn-add { display: inline-block; padding: 12px 24px; background: #0d6efd; color: #fff; border-radius: 10px; text-decoration: none; font-weight: 600; margin-top: 16px; }
    .empty-state { text-align: center; padding: 40px; color: #666; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo"><i class="fas fa-home"></i> سكني</a>
      <div class="nav-links">
        <a href="index.html">الرئيسية</a>
        <a href="dashboard.html" class="active">لوحة التحكم</a>
        <a href="chat.html">الرسائل</a>
        <a href="favorites.html">المفضلة</a>
        <a href="bookings.html">حجوزاتي</a>
        <a href="#" onclick="logoutUser(); return false;">تسجيل الخروج</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="dashboard-header">
      <h1 id="welcomeTitle">مرحباً بيك!</h1>
      <p>إدارة عقاراتك وحجوزاتك</p>
    </div>

    <div class="stats-grid" id="statsGrid"></div>

    <div id="ownerSection" style="display:none;">
      <h2 class="section-title">عقاراتي</h2>
      <div id="myProperties"></div>
      <a href="add-property.html" class="btn-add"><i class="fas fa-plus"></i> إضافة عقار جديد</a>
    </div>

    <div id="studentSection" style="display:none;">
      <h2 class="section-title">حجوزاتي</h2>
      <div id="myBookings"></div>
    </div>

    <div id="adminSection" style="display:none;">
      <h2 class="section-title">إدارة المنصة</h2>
      <a href="admin.html" class="btn-add"><i class="fas fa-cog"></i> لوحة الإدارة</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="utils.js"></script>
  <script src="auth.js"></script>
  <script src="db.js"></script>
  <script>
    auth.onAuthStateChanged(async function(user) {
      if (!user) {
        window.location.href = 'auth.html?redirect=' + encodeURIComponent(window.location.pathname);
        return;
      }

      var snap = await db.ref('users/' + user.uid).get();
      var userData = snap.val() || {};

      document.getElementById('welcomeTitle').textContent = 'مرحباً يا ' + escapeHtml(userData.name || 'مستخدم') + '!';

      // Stats
      var stats = [];
      if (userData.role === 'owner') {
        var props = await getAll('properties');
        var mine = props.filter(function(p) { return p.ownerId === user.uid; });
        var bookings = await getOwnerBookings(user.uid);
        stats = [
          { value: mine.length, label: 'عقار' },
          { value: bookings.length, label: 'حجز' },
          { value: mine.filter(function(p) { return p.status === 'pending'; }).length, label: 'بانتظار الموافقة' }
        ];
        document.getElementById('ownerSection').style.display = 'block';
        loadOwnerProperties(user.uid);
      } else if (userData.role === 'student') {
        var bookings = await getUserBookings(user.uid);
        var favs = await getUserFavorites(user.uid);
        stats = [
          { value: bookings.length, label: 'حجز' },
          { value: favs.length, label: 'مفضلة' }
        ];
        document.getElementById('studentSection').style.display = 'block';
        loadStudentBookings(user.uid);
      } else if (userData.role === 'admin') {
        var allUsers = await getAll('users');
        var allProps = await getAll('properties');
        var allBookings = await getAll('bookings');
        stats = [
          { value: allUsers.length, label: 'مستخدم' },
          { value: allProps.length, label: 'عقار' },
          { value: allBookings.length, label: 'حجز' }
        ];
        document.getElementById('adminSection').style.display = 'block';
      }

      document.getElementById('statsGrid').innerHTML = stats.map(function(s) {
        return '<div class="stat-card"><h3>' + s.value + '</h3><p>' + s.label + '</p></div>';
      }).join('');
    });

    async function loadOwnerProperties(ownerId) {
      var props = await getAll('properties');
      var mine = props.filter(function(p) { return p.ownerId === ownerId; });
      var container = document.getElementById('myProperties');
      if (mine.length === 0) {
        container.innerHTML = '<div class="empty-state">مفيش عقارات لسه. أضف عقارك الأول!</div>';
        return;
      }
      container.innerHTML = mine.map(function(p) {
        return '<div class="property-list-card">' +
          '<div><h4>' + escapeHtml(p.title) + '</h4><p>' + escapeHtml(p.area) + ' — ' + p.price + ' ج.م/شهر</p></div>' +
          '<span class="badge-status ' + (p.status === 'active' ? 'status-active' : 'status-pending') + '">' + (p.status === 'active' ? 'نشط' : 'معلق') + '</span>' +
        '</div>';
      }).join('');
    }

    async function loadStudentBookings(studentId) {
      var bookings = await getUserBookings(studentId);
      var container = document.getElementById('myBookings');
      if (bookings.length === 0) {
        container.innerHTML = '<div class="empty-state">مفيش حجوزات لسه.</div>';
        return;
      }
      var statusClass = { pending: 'status-pending', approved: 'status-active', rejected: 'status-pending', cancelled: 'status-pending' };
      var statusText = { pending: 'بانتظار الموافقة', approved: 'تمت الموافقة', rejected: 'تم الرفض', cancelled: 'ملغي' };
      container.innerHTML = bookings.map(function(b) {
        return '<div class="property-list-card">' +
          '<div><h4>' + escapeHtml(b.propertyTitle) + '</h4><p>من ' + b.startDate + ' إلى ' + b.endDate + '</p></div>' +
          '<span class="badge-status ' + (statusClass[b.status] || 'status-pending') + '">' + (statusText[b.status] || b.status) + '</span>' +
        '</div>';
      }).join('');
    }
  </script>
</body>
</html>
