<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إضافة عقار | سكني</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <header class="header">
    <div class="header-container">
      <a href="index.html" class="logo"><i class="fas fa-home"></i><span>سكني</span></a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">الرئيسية</a></li>
          <li><a href="dashboard.html">لوحة التحكم</a></li>
          <li><a href="add-property.html" class="active">إضافة عقار</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button class="icon-btn theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
        <div class="user-menu" id="userMenu">
          <img src="" alt="User" class="user-avatar" id="userAvatar">
          <div class="dropdown" id="userDropdown">
            <a href="dashboard.html" class="dropdown-item"><i class="fas fa-user"></i> حسابي</a>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="property-detail">
    <div class="breadcrumb">
      <a href="index.html">الرئيسية</a>
      <i class="fas fa-chevron-left" style="font-size: 0.75rem;"></i>
      <span>إضافة عقار جديد</span>
    </div>

    <div style="max-width: 800px; margin: 0 auto;">
      <div class="detail-section">
        <h2><i class="fas fa-plus-circle"></i> إضافة عقار جديد</h2>
        <p style="color: var(--gray-500); margin-bottom: 1.5rem;">أدخل تفاصيل العقار وسيتم نشره فوراً للطلاب</p>

        <form id="addPropertyForm" onsubmit="submitProperty(event)">
          <div class="form-row">
            <div class="form-group">
              <label>عنوان العقار *</label>
              <input type="text" class="form-input" id="propTitle" required placeholder="مثال: غرفة مفروشة للطلاب">
            </div>
            <div class="form-group">
              <label>نوع السكن *</label>
              <select class="form-select" id="propType" required>
                <option value="shared_room">غرفة مشتركة</option>
                <option value="private_room">غرفة خاصة</option>
                <option value="studio">استوديو</option>
                <option value="apartment">شقة</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>الموقع / المنطقة *</label>
              <select class="form-select" id="propLocation" required>
                <option value="مدينة نصر">مدينة نصر</option>
                <option value="المعادي">المعادي</option>
                <option value="الحي العاشر">الحي العاشر</option>
                <option value="مصر الجديدة">مصر الجديدة</option>
                <option value="الدقي">الدقي</option>
                <option value="المهندسين">المهندسين</option>
                <option value="القاهرة الجديدة">القاهرة الجديدة</option>
                <option value="6 أكتوبر">6 أكتوبر</option>
                <option value="الشيخ زايد">الشيخ زايد</option>
                <option value="المقطم">المقطم</option>
                <option value="الإسكندرية - سموحة">الإسكندرية - سموحة</option>
                <option value="الإسكندرية - العجمي">الإسكندرية - العجمي</option>
                <option value="طنطا">طنطا</option>
                <option value="المنصورة">المنصورة</option>
                <option value="الزقازيق">الزقازيق</option>
                <option value="بنها">بنها</option>
                <option value="أسيوط">أسيوط</option>
                <option value="سوهاج">سوهاج</option>
              </select>
            </div>
            <div class="form-group">
              <label>العنوان التفصيلي *</label>
              <input type="text" class="form-input" id="propAddress" required placeholder="شارع، عمارة، شقة">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>السعر الشهري (ج.م) *</label>
              <input type="number" class="form-input" id="propPrice" required min="500" placeholder="2500">
            </div>
            <div class="form-group">
              <label>عدد الغرف</label>
              <input type="number" class="form-input" id="propRooms" min="1" value="1">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>عدد الطلاب في الغرفة</label>
              <input type="number" class="form-input" id="propStudents" min="1" value="1">
            </div>
            <div class="form-group">
              <label>تاريخ التوفر</label>
              <input type="date" class="form-input" id="propAvailable">
            </div>
          </div>

          <div class="form-group">
            <label>وصف العقار *</label>
            <textarea class="form-input" id="propDescription" rows="4" required placeholder="اكتب وصفاً تفصيلياً للعقار..."></textarea>
          </div>

          <div class="form-group">
            <label>رابط الصورة الرئيسية *</label>
            <input type="url" class="form-input" id="propImage" required placeholder="https://example.com/image.jpg">
          </div>

          <div class="form-group">
            <label>الخدمات المتاحة</label>
            <div class="checkbox-group" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.5rem;">
              <label class="checkbox-item"><input type="checkbox" id="am_wifi" value="wifi"><span>واي فاي</span></label>
              <label class="checkbox-item"><input type="checkbox" id="am_ac" value="ac"><span>تكييف</span></label>
              <label class="checkbox-item"><input type="checkbox" id="am_fridge" value="fridge"><span>ثلاجة</span></label>
              <label class="checkbox-item"><input type="checkbox" id="am_washing" value="washing"><span>غسالة</span></label>
              <label class="checkbox-item"><input type="checkbox" id="am_tv" value="tv"><span>تلفزيون</span></label>
              <label class="checkbox-item"><input type="checkbox" id="am_kitchen" value="kitchen"><span>مطبخ</span></label>
              <label class="checkbox-item"><input type="checkbox" id="am_parking" value="parking"><span>جراج</span></label>
              <label class="checkbox-item"><input type="checkbox" id="am_security" value="security"><span>أمن</span></label>
              <label class="checkbox-item"><input type="checkbox" id="am_elevator" value="elevator"><span>مصعد</span></label>
              <label class="checkbox-item"><input type="checkbox" id="am_balcony" value="balcony"><span>بلكونة</span></label>
            </div>
          </div>

          <div class="form-row">
            <div class="form-check" style="margin-bottom: 1rem;">
              <input type="checkbox" id="propFurnished">
              <label for="propFurnished">مفروش</label>
            </div>
            <div class="form-check" style="margin-bottom: 1rem;">
              <input type="checkbox" id="propInternet">
              <label for="propInternet">إنترنت</label>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
            <i class="fas fa-plus"></i> نشر العقار
          </button>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-container">
      <div class="footer-section"><h3>عن سكني</h3><p>منصة سكني هي أكبر منصة للبحث عن السكن الطلابي في مصر.</p></div>
    </div>
    <div class="footer-bottom"><p>© 2026 سكني. جميع الحقوق محفوظة.</p></div>
  </footer>

  <script src="db.js"></script>
  <script>
    let currentUser = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await seedDatabase();
      currentUser = getCurrentUser();
      if (!currentUser || currentUser.role !== 'owner') {
        window.location.href = currentUser ? 'index.html' : 'auth.html';
        return;
      }
      document.getElementById('userAvatar').src = currentUser.avatar;
      document.getElementById('propAvailable').value = new Date().toISOString().split('T')[0];
      setupTheme();
    });

    document.getElementById('userAvatar')?.addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('userDropdown').classList.toggle('show');
    });
    document.addEventListener('click', () => document.getElementById('userDropdown')?.classList.remove('show'));

    async function submitProperty(e) {
      e.preventDefault();

      const typeMap = {
        'shared_room': 'غرفة مشتركة',
        'private_room': 'غرفة خاصة',
        'studio': 'استوديو',
        'apartment': 'شقة'
      };

      const amenitiesList = [
        {id: 'wifi', name: 'واي فاي', icon: 'fa-wifi'},
        {id: 'ac', name: 'تكييف', icon: 'fa-snowflake'},
        {id: 'fridge', name: 'ثلاجة', icon: 'fa-box'},
        {id: 'washing', name: 'غسالة', icon: 'fa-soap'},
        {id: 'tv', name: 'تلفزيون', icon: 'fa-tv'},
        {id: 'kitchen', name: 'مطبخ', icon: 'fa-utensils'},
        {id: 'parking', name: 'جراج', icon: 'fa-car'},
        {id: 'security', name: 'أمن', icon: 'fa-shield-alt'},
        {id: 'elevator', name: 'مصعد', icon: 'fa-arrow-up'},
        {id: 'balcony', name: 'بلكونة', icon: 'fa-sun'}
      ];

      const selectedAmenities = [];
      amenitiesList.forEach(a => {
        if (document.getElementById('am_' + a.id)?.checked) selectedAmenities.push(a);
      });

      const propId = 'prop_' + Date.now();
      const property = {
        id: propId,
        title: document.getElementById('propTitle').value,
        type: document.getElementById('propType').value,
        typeName: typeMap[document.getElementById('propType').value],
        price: parseInt(document.getElementById('propPrice').value),
        location: document.getElementById('propLocation').value,
        area: document.getElementById('propLocation').value,
        address: document.getElementById('propAddress').value,
        rooms: parseInt(document.getElementById('propRooms').value) || 1,
        studentsPerRoom: parseInt(document.getElementById('propStudents').value) || 1,
        internet: document.getElementById('propInternet').checked,
        furnished: document.getElementById('propFurnished').checked,
        ac: document.getElementById('am_ac')?.checked || false,
        images: [document.getElementById('propImage').value],
        ownerId: currentUser.id,
        ownerName: currentUser.name,
        ownerPhone: currentUser.phone,
        ownerAvatar: currentUser.avatar,
        rating: 0,
        reviewsCount: 0,
        description: document.getElementById('propDescription').value,
        amenities: selectedAmenities,
        availableFrom: document.getElementById('propAvailable').value,
        availableTo: new Date(Date.now() + 31536000000).toISOString().split('T')[0],
        status: 'active',
        createdAt: new Date().toISOString(),
        views: 0,
        coordinates: {lat: 30.0 + Math.random() * 2, lng: 31.0 + Math.random() * 2}
      };

      await add('properties', property);
      showToast('تم نشر العقار بنجاح! 🎉', 'success');
      setTimeout(() => window.location.href = 'property.html?id=' + propId, 1500);
    }

    function setupTheme() {
      const saved = localStorage.getItem('theme');
      const toggleBtn = document.getElementById('themeToggle');
      if (saved === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        if (toggleBtn) toggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
      }
      if (toggleBtn) {
        toggleBtn.addEventListener('click', function() {
          const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
          if (isDark) {
            document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
            toggleBtn.innerHTML = '<i class="fas fa-moon"></i>';
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            toggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
          }
        });
      }
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icons = { success: 'fa-check-circle', error: 'fa-times-circle', warning: 'fa-exclamation-circle' };
      toast.innerHTML = `<i class="fas ${icons[type]}"></i><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(-20px)'; setTimeout(() => toast.remove(), 300); }, 3000);
    }
  </script>
</body>
</html>
