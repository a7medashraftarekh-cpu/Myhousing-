<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com 'unsafe-inline'; style-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; img-src * data:; connect-src https://*.firebaseio.com https://*.googleapis.com;">
  <title>حجوزاتي | سكني</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .navbar { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.06); padding: 12px 0; position: sticky; top: 0; z-index: 50; }
    .nav-container { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .logo { font-size: 22px; font-weight: 700; color: #0d6efd; text-decoration: none; }
    .nav-links { display: flex; gap: 24px; align-items: center; }
    .nav-links a { color: #333; text-decoration: none; font-size: 15px; font-weight: 500; }
    .nav-links a:hover, .nav-links a.active { color: #0d6efd; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .booking-card { background: #fff; border-radius: 16px; padding: 24px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
    .booking-info h4 { margin-bottom: 6px; }
    .booking-info p { color: #666; font-size: 14px; }
    .booking-status { padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; }
    .status-pending { background: #fff3cd; color: #856404; }
    .status-approved { background: #d4edda; color: #155724; }
    .status-rejected { background: #f8d7da; color: #721c24; }
    .status-cancelled { background: #e2e3e5; color: #383d41; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo"><i class="fas fa-home"></i> سكني</a>
      <div class="nav-links">
        <a href="index.html">الرئيسية</a>
        <a href="dashboard.html">لوحة التحكم</a>
        <a href="bookings.html" class="active">حجوزاتي</a>
        <a href="#" onclick="logoutUser(); return false;">تسجيل الخروج</a>
      </div>
    </div>
  </nav>

  <div class="container" style="padding: 40px 20px;">
    <h1>حجوزاتي <i class="fas fa-calendar-check" style="color:#0d6efd;"></i></h1>
    <p style="color:#666; margin-bottom:30px;">تابع حجوزاتك ومواعيدك</p>
    <div id="bookingsList"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="utils.js"></script>
  <script src="auth.js"></script>
  <script src="db.js"></script>
  <script>
    auth.onAuthStateChanged(async function(user) {
      if (!user) {
        window.location.href = 'auth.html?redirect=' + encodeURIComponent(window.location.pathname);
        return;
      }
      loadBookings(user.uid);
    });

    async function loadBookings(uid) {
      var bookings = await getUserBookings(uid);
      var container = document.getElementById('bookingsList');
      if (bookings.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#666; padding:40px;">مفيش حجوزات لسه. <a href="index.html" style="color:#0d6efd;">ابحث عن عقار</a></p>';
        return;
      }
      var statusClass = { pending: 'status-pending', approved: 'status-approved', rejected: 'status-rejected', cancelled: 'status-cancelled' };
      var statusText = { pending: 'بانتظار الموافقة', approved: 'تمت الموافقة', rejected: 'تم الرفض', cancelled: 'ملغي' };
      container.innerHTML = bookings.map(function(b) {
        return '<div class="booking-card">' +
          '<div class="booking-info">' +
            '<h4>' + escapeHtml(b.propertyTitle) + '</h4>' +
            '<p><i class="fas fa-calendar"></i> من ' + b.startDate + ' إلى ' + b.endDate + '</p>' +
            '<p><i class="fas fa-money-bill"></i> ' + b.price + ' ج.م/شهر</p>' +
          '</div>' +
          '<span class="booking-status ' + (statusClass[b.status] || 'status-pending') + '">' + (statusText[b.status] || b.status) + '</span>' +
        '</div>';
      }).join('');
    }
  </script>
</body>
</html>
