<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com 'unsafe-inline'; style-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; img-src * data:; connect-src https://*.firebaseio.com https://*.googleapis.com;">
  <title>تسجيل الدخول | سكني</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); padding: 20px; }
    .auth-container { width: 100%; max-width: 440px; background: #fff; padding: 40px; border-radius: 20px; box-shadow: 0 8px 40px rgba(0,0,0,0.08); }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo h2 { color: #0d6efd; font-size: 28px; }
    .auth-logo p { color: #666; font-size: 14px; margin-top: 6px; }
    .auth-tabs { display: flex; margin-bottom: 24px; border-bottom: 2px solid #eee; }
    .auth-tab { flex: 1; padding: 14px; text-align: center; cursor: pointer; font-weight: 600; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: 0.3s; background: none; border: none; font-size: 15px; }
    .auth-tab.active { color: #0d6efd; border-bottom-color: #0d6efd; }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; }
    .form-group input, .form-group select { width: 100%; padding: 13px 16px; border: 1.5px solid #e0e0e0; border-radius: 12px; font-size: 15px; transition: 0.2s; font-family: inherit; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #0d6efd; box-shadow: 0 0 0 4px rgba(13,110,253,0.08); }
    .btn-auth { width: 100%; padding: 15px; background: #0d6efd; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-auth:hover { background: #0b5ed7; }
    .btn-auth:disabled { opacity: 0.6; cursor: not-allowed; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 14px; color: #666; }
    .auth-footer a { color: #0d6efd; cursor: pointer; font-weight: 500; }
    .error-msg { color: #dc3545; font-size: 13px; margin-top: 6px; display: none; }
    .success-msg { color: #198754; font-size: 14px; text-align: center; margin-top: 12px; display: none; }
    .password-strength { height: 5px; border-radius: 3px; margin-top: 8px; transition: 0.3s; }
    .strength-text { font-size: 12px; margin-top: 5px; font-weight: 500; }
    .forgot-link { text-align: left; font-size: 13px; margin-top: -8px; margin-bottom: 16px; }
    .forgot-link a { color: #0d6efd; cursor: pointer; font-weight: 500; }
    .hidden { display: none !important; }
    .back-link { text-align: center; margin-top: 16px; }
    .back-link a { color: #0d6efd; cursor: pointer; font-size: 14px; }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-logo">
        <h2><i class="fas fa-home"></i> سكني</h2>
        <p>أهلاً بيك! سجّل دخولك أو اعمل حساب جديد</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" onclick="showForm('login')">تسجيل الدخول</button>
        <button class="auth-tab" onclick="showForm('register')">إنشاء حساب</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form active" onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="loginEmail" required placeholder="example@email.com" autocomplete="email">
          <div class="error-msg" id="loginEmailError"></div>
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
          <div class="error-msg" id="loginPasswordError"></div>
        </div>
        <div class="forgot-link"><a onclick="showForm('forgot')">نسيت كلمة المرور؟</a></div>
        <button type="submit" class="btn-auth" id="loginBtn">تسجيل الدخول</button>
        <div class="error-msg" id="loginError" style="text-align:center; margin-top:12px;"></div>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="auth-form" onsubmit="return handleRegister(event)">
        <div class="form-group">
          <label>الاسم الكامل *</label>
          <input type="text" id="regName" required placeholder="محمد أحمد" minlength="3">
        </div>
        <div class="form-group">
          <label>البريد الإلكتروني *</label>
          <input type="email" id="regEmail" required placeholder="example@email.com" autocomplete="email">
          <div class="error-msg" id="regEmailError"></div>
        </div>
        <div class="form-group">
          <label>رقم الهاتف *</label>
          <input type="tel" id="regPhone" required placeholder="01xxxxxxxxx" pattern="01[0-9]{9}">
        </div>
        <div class="form-group">
          <label>نوع الحساب *</label>
          <select id="regRole" required>
            <option value="student">طالب</option>
            <option value="owner">مالك عقار</option>
          </select>
        </div>
        <div class="form-group hidden" id="uniField">
          <label>الجامعة</label>
          <input type="text" id="regUni" placeholder="جامعة القاهرة">
        </div>
        <div class="form-group">
          <label>كلمة المرور *</label>
          <input type="password" id="regPassword" required placeholder="••••••••" minlength="8" oninput="checkStrength()" autocomplete="new-password">
          <div class="password-strength" id="strengthBar"></div>
          <div class="strength-text" id="strengthText"></div>
          <div class="error-msg" id="regPasswordError"></div>
        </div>
        <div class="form-group">
          <label>تأكيد كلمة المرور *</label>
          <input type="password" id="regConfirm" required placeholder="••••••••" autocomplete="new-password">
          <div class="error-msg" id="regConfirmError"></div>
        </div>
        <button type="submit" class="btn-auth" id="regBtn">إنشاء حساب</button>
        <div class="error-msg" id="regError" style="text-align:center; margin-top:12px;"></div>
        <div class="success-msg" id="regSuccess"></div>
      </form>

      <!-- Forgot Password Form -->
      <form id="forgotForm" class="auth-form" onsubmit="return handleForgot(event)">
        <p style="margin-bottom:20px; color:#666; font-size:14px; line-height:1.7;">هنبعتلك لينك إعادة تعيين كلمة المرور على إيميلك. اتفقد inbox و spam folder.</p>
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="forgotEmail" required placeholder="example@email.com">
        </div>
        <button type="submit" class="btn-auth" id="forgotBtn">إرسال اللينك</button>
        <div class="success-msg" id="forgotSuccess"></div>
        <div class="error-msg" id="forgotError" style="text-align:center; margin-top:12px;"></div>
        <div class="back-link"><a onclick="showForm('login')">رجوع لتسجيل الدخول</a></div>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="utils.js"></script>
  <script src="auth.js"></script>
  <script src="db.js"></script>
  <script>
    // Redirect if already logged in
    auth.onAuthStateChanged(function(user) {
      if (user) {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('redirect') || 'index.html';
        window.location.href = redirect;
      }
    });

    document.getElementById('regRole').addEventListener('change', function(e) {
      document.getElementById('uniField').classList.toggle('hidden', e.target.value !== 'student');
    });

    function showForm(type) {
      document.querySelectorAll('.auth-form').forEach(function(f) { f.classList.remove('active'); });
      document.querySelectorAll('.auth-tab').forEach(function(t) { t.classList.remove('active'); });
      if (type === 'login') {
        document.getElementById('loginForm').classList.add('active');
        document.querySelectorAll('.auth-tab')[0].classList.add('active');
      } else if (type === 'register') {
        document.getElementById('registerForm').classList.add('active');
        document.querySelectorAll('.auth-tab')[1].classList.add('active');
      } else if (type === 'forgot') {
        document.getElementById('forgotForm').classList.add('active');
        document.querySelectorAll('.auth-tab').forEach(function(t) { t.classList.remove('active'); });
      }
      hideErrors();
    }

    function checkStrength() {
      var pass = document.getElementById('regPassword').value;
      var result = checkPasswordStrength(pass);
      var bar = document.getElementById('strengthBar');
      var text = document.getElementById('strengthText');
      bar.style.width = (result.score / 6 * 100) + '%';
      bar.style.background = result.color;
      text.textContent = result.score > 0 ? 'قوة كلمة المرور: ' + result.strength : '';
      text.style.color = result.color;
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideErrors();
      setLoading('loginBtn', true);

      try {
        var email = document.getElementById('loginEmail').value.trim();
        var password = document.getElementById('loginPassword').value;

        if (!validateEmail(email)) throw new Error('الإيميل مش صحيح');
        if (password.length < 6) throw new Error('كلمة المرور قصيرة جداً');

        await loginUser(email, password);
        var params = new URLSearchParams(window.location.search);
        window.location.href = params.get('redirect') || 'index.html';
      } catch (err) {
        showError('loginError', err.message || 'فشل تسجيل الدخول. اتأكد من البيانات.');
        setLoading('loginBtn', false);
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideErrors();
      setLoading('regBtn', true);

      try {
        var name = document.getElementById('regName').value.trim();
        var email = document.getElementById('regEmail').value.trim();
        var phone = document.getElementById('regPhone').value.trim();
        var role = document.getElementById('regRole').value;
        var uni = document.getElementById('regUni').value.trim();
        var password = document.getElementById('regPassword').value;
        var confirm = document.getElementById('regConfirm').value;

        validateRequired(name, 'الاسم');
        if (name.length < 3) throw new Error('الاسم لازم يكون 3 أحرف على الأقل');
        if (!validateEmail(email)) throw new Error('الإيميل مش صحيح');
        if (!validatePhone(phone)) throw new Error('رقم الهاتف لازم يبدأ بـ 01 ويكون 11 رقم');
        if (password !== confirm) throw new Error('كلمتي المرور مش متطابقتين');

        await registerUser(email, password, { name: name, phone: phone, role: role, university: uni });

        document.getElementById('regSuccess').textContent = 'تم إنشاء الحساب! اتفقد إيميلك عشان تفعيل الحساب.';
        document.getElementById('regSuccess').style.display = 'block';
        document.getElementById('registerForm').reset();
        setTimeout(function() { showForm('login'); }, 4000);
      } catch (err) {
        showError('regError', err.message || 'فشل إنشاء الحساب. جرب إيميل تاني.');
        setLoading('regBtn', false);
      }
    }

    async function handleForgot(e) {
      e.preventDefault();
      hideErrors();
      setLoading('forgotBtn', true);

      try {
        var email = document.getElementById('forgotEmail').value.trim();
        if (!validateEmail(email)) throw new Error('الإيميل مش صحيح');
        await resetPassword(email);
        document.getElementById('forgotSuccess').textContent = 'تم إرسال اللينك! اتفقد إيميلك (و Spam folder).';
        document.getElementById('forgotSuccess').style.display = 'block';
      } catch (err) {
        showError('forgotError', err.message || 'فشل إرسال اللينك. اتأكد من الإيميل.');
        setLoading('forgotBtn', false);
      }
    }
  </script>
</body>
</html>
