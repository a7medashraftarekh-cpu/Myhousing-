<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com 'unsafe-inline'; style-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; img-src * data:; connect-src https://*.firebaseio.com https://*.googleapis.com;">
  <title>سكني | ابحث عن سكنك المثالي</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .hero { background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%); color: #fff; padding: 80px 20px; text-align: center; }
    .hero h1 { font-size: 42px; margin-bottom: 16px; }
    .hero p { font-size: 18px; opacity: 0.9; margin-bottom: 32px; }
    .search-box { background: #fff; padding: 24px; border-radius: 16px; max-width: 900px; margin: 0 auto; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
    .search-row { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 12px; align-items: end; }
    @media (max-width: 768px) { .search-row { grid-template-columns: 1fr; } }
    .search-row label { display: block; margin-bottom: 6px; font-size: 14px; color: #666; font-weight: 500; }
    .search-row input, .search-row select { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; }
    .btn-search { padding: 12px 28px; background: #0d6efd; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .properties-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; padding: 40px 0; }
    .property-card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); transition: 0.3s; cursor: pointer; }
    .property-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
    .property-card img { width: 100%; height: 220px; object-fit: cover; }
    .property-info { padding: 20px; }
    .property-info h4 { margin-bottom: 8px; font-size: 17px; }
    .property-meta { display: flex; gap: 16px; color: #666; font-size: 13px; margin-bottom: 12px; }
    .property-price { color: #0d6efd; font-weight: 700; font-size: 18px; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-new { background: #d4edda; color: #155724; }
    .badge-featured { background: #fff3cd; color: #856404; }
    .user-menu { position: relative; }
    .user-menu img { width: 36px; height: 36px; border-radius: 50%; cursor: pointer; }
    .dropdown { position: absolute; left: 0; top: 48px; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.12); min-width: 180px; display: none; z-index: 100; }
    .dropdown a { display: block; padding: 12px 16px; color: #333; font-size: 14px; border-bottom: 1px solid #f5f5f5; text-decoration: none; }
    .dropdown a:hover { background: #f8f9fa; }
    .dropdown.show { display: block; }
    .navbar { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.06); padding: 12px 0; position: sticky; top: 0; z-index: 50; }
    .nav-container { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .logo { font-size: 22px; font-weight: 700; color: #0d6efd; text-decoration: none; }
    .nav-links { display: flex; gap: 24px; align-items: center; }
    .nav-links a { color: #333; text-decoration: none; font-size: 15px; font-weight: 500; transition: 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: #0d6efd; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo"><i class="fas fa-home"></i> سكني</a>
      <div class="nav-links">
        <a href="index.html" class="active">الرئيسية</a>
        <a href="dashboard.html">لوحة التحكم</a>
        <a href="favorites.html">المفضلة</a>
        <a href="chat.html">الرسائل</a>
        <a href="auth.html" id="authLink">تسجيل الدخول</a>
        <div class="user-menu" id="userMenu" style="display:none;">
          <img id="userAvatar" src="" onclick="document.getElementById('userDropdown').classList.toggle('show')">
          <div class="dropdown" id="userDropdown">
            <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> لوحة التحكم</a>
            <a href="bookings.html"><i class="fas fa-calendar-check"></i> حجوزاتي</a>
            <a href="favorites.html"><i class="fas fa-heart"></i> المفضلة</a>
            <a href="#" onclick="logoutUser(); return false;"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="hero">
    <h1>ابحث عن سكنك المثالي</h1>
    <p>أكثر من 500 عقار ينتظرك في مختلف المحافظات</p>
    <div class="search-box">
      <div class="search-row">
        <div>
          <label>المنطقة</label>
          <select id="searchArea">
            <option value="all">كل المناطق</option>
            <option value="مدينة نصر">مدينة نصر</option>
            <option value="المعادي">المعادي</option>
            <option value="القاهرة الجديدة">القاهرة الجديدة</option>
            <option value="6 أكتوبر">6 أكتوبر</option>
            <option value="الإسكندرية">الإسكندرية</option>
            <option value="طنطا">طنطا</option>
            <option value="المنصورة">المنصورة</option>
          </select>
        </div>
        <div>
          <label>نوع السكن</label>
          <select id="searchType">
            <option value="all">كل الأنواع</option>
            <option value="shared_room">غرفة مشتركة</option>
            <option value="private_room">غرفة خاصة</option>
            <option value="studio">استوديو</option>
            <option value="apartment">شقة</option>
          </select>
        </div>
        <div>
          <label>السعر الأقصى</label>
          <input type="number" id="searchMaxPrice" placeholder="ج.م">
        </div>
        <button class="btn-search" onclick="search()"><i class="fas fa-search"></i> بحث</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:40px;">
      <h2>أحدث العقارات</h2>
      <select id="sortBy" onchange="search()" style="padding:8px 12px; border-radius:8px; border:1px solid #ddd;">
        <option value="newest">الأحدث</option>
        <option value="price_asc">السعر: من الأقل</option>
        <option value="price_desc">السعر: من الأعلى</option>
        <option value="rating">الأعلى تقييماً</option>
      </select>
    </div>
    <div id="propertiesGrid" class="properties-grid"></div>
    <div id="noResults" style="display:none; text-align:center; padding:60px; color:#666;">
      <i class="fas fa-search" style="font-size:48px; margin-bottom:16px; opacity:0.3;"></i>
      <p>مفيش نتائج مطابقة للبحث</p>
    </div>
  </div>

  <footer style="background:#1a1a2e; color:#fff; padding:40px 20px; margin-top:60px;">
    <div class="container" style="text-align:center;">
      <h3 style="margin-bottom:12px;"><i class="fas fa-home"></i> سكني</h3>
      <p style="opacity:0.7; font-size:14px;">منصة سكني هي أكبر منصة للبحث عن السكن الطلابي في مصر.</p>
      <p style="opacity:0.5; font-size:13px; margin-top:20px;">© 2026 سكني. جميع الحقوق محفوظة.</p>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="utils.js"></script>
  <script src="auth.js"></script>
  <script src="db.js"></script>
  <script>
    auth.onAuthStateChanged(function(user) {
      updateNavbar();
      search();
    });

    async function search() {
      var filters = {
        status: 'active',
        type: document.getElementById('searchType').value,
        location: document.getElementById('searchArea').value,
        maxPrice: document.getElementById('searchMaxPrice').value,
        sort: document.getElementById('sortBy').value
      };

      var props = await searchProperties(filters);
      var grid = document.getElementById('propertiesGrid');
      var noResults = document.getElementById('noResults');

      if (props.length === 0) {
        grid.innerHTML = '';
        noResults.style.display = 'block';
        return;
      }

      noResults.style.display = 'none';
      grid.innerHTML = props.slice(0, 12).map(function(p) {
        var isNew = p.createdAt && new Date(p.createdAt) > new Date(Date.now()-604800000);
        return '<div class="property-card" onclick="window.location.href='property.html?id=' + p.id + ''">' +
          '<img src="' + escapeHtml(p.images && p.images[0]) + '" alt="' + escapeHtml(p.title) + '" onerror="this.src='https://via.placeholder.com/400x300?text=No+Image'">' +
          '<div class="property-info">' +
            '<div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">' +
              '<h4>' + escapeHtml(p.title) + '</h4>' +
              '<span class="badge ' + (isNew ? 'badge-new' : 'badge-featured') + '">' + (isNew ? 'جديد' : 'مميز') + '</span>' +
            '</div>' +
            '<div class="property-meta">' +
              '<span><i class="fas fa-map-marker-alt"></i> ' + escapeHtml(p.area) + '</span>' +
              '<span><i class="fas fa-bed"></i> ' + (p.rooms || 1) + ' غرف</span>' +
              '<span><i class="fas fa-star"></i> ' + (p.rating || 0) + '</span>' +
            '</div>' +
            '<div class="property-price">' + (p.price || 0) + ' ج.م/شهر</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }
  </script>
</body>
</html>
