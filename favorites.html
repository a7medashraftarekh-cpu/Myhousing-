<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com 'unsafe-inline'; style-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; img-src * data:; connect-src https://*.firebaseio.com https://*.googleapis.com;">
  <title>المفضلة | سكني</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .navbar { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.06); padding: 12px 0; position: sticky; top: 0; z-index: 50; }
    .nav-container { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .logo { font-size: 22px; font-weight: 700; color: #0d6efd; text-decoration: none; }
    .nav-links { display: flex; gap: 24px; align-items: center; }
    .nav-links a { color: #333; text-decoration: none; font-size: 15px; font-weight: 500; }
    .nav-links a:hover, .nav-links a.active { color: #0d6efd; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .properties-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; padding: 40px 0; }
    .property-card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .property-card img { width: 100%; height: 200px; object-fit: cover; }
    .property-info { padding: 16px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo"><i class="fas fa-home"></i> سكني</a>
      <div class="nav-links">
        <a href="index.html">الرئيسية</a>
        <a href="dashboard.html">لوحة التحكم</a>
        <a href="favorites.html" class="active">المفضلة</a>
        <a href="#" onclick="logoutUser(); return false;">تسجيل الخروج</a>
      </div>
    </div>
  </nav>

  <div class="container" style="padding: 40px 20px;">
    <h1>المفضلة <i class="fas fa-heart" style="color:#dc3545;"></i></h1>
    <p style="color:#666; margin-bottom:30px;">العقارات اللي حفظتها</p>
    <div id="favoritesGrid" class="properties-grid"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="utils.js"></script>
  <script src="auth.js"></script>
  <script src="db.js"></script>
  <script>
    auth.onAuthStateChanged(async function(user) {
      if (!user) {
        window.location.href = 'auth.html?redirect=' + encodeURIComponent(window.location.pathname);
        return;
      }
      loadFavorites(user.uid);
    });

    async function loadFavorites(uid) {
      var favorites = await getUserFavorites(uid);
      var container = document.getElementById('favoritesGrid');
      if (favorites.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#666; padding:40px;">مفيش عقارات في المفضلة لسه. <a href="index.html" style="color:#0d6efd;">استكشف العقارات</a></p>';
        return;
      }
      var allProps = await getAll('properties');
      var favProps = favorites.map(function(f) {
        return allProps.find(function(p) { return p.id === f.propertyId; });
      }).filter(function(p) { return !!p; });

      container.innerHTML = favProps.map(function(p) {
        return '<div class="property-card">' +
          '<img src="' + escapeHtml(p.images && p.images[0]) + '" style="width:100%; height:200px; object-fit:cover;" onerror="this.src='https://via.placeholder.com/400x300?text=No+Image'">' +
          '<div class="property-info">' +
            '<h4 style="margin-bottom:8px;">' + escapeHtml(p.title) + '</h4>' +
            '<p style="color:#666; font-size:14px; margin-bottom:8px;"><i class="fas fa-map-marker-alt"></i> ' + escapeHtml(p.area) + '</p>' +
            '<div style="display:flex; justify-content:space-between; align-items:center;">' +
              '<span style="color:#0d6efd; font-weight:700; font-size:18px;">' + p.price + ' ج.م</span>' +
              '<a href="property.html?id=' + p.id + '" class="btn btn-primary" style="padding:8px 16px; font-size:14px;">التفاصيل</a>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }
  </script>
</body>
</html>
